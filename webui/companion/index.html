<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeshCore Node</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--ink:#1c1f24;--dim:#6a727d;--line:#dfe3e8;--accent:#0b7a75;--accent-ink:#fff;--mine:#d9f1ee;--theirs:#eceff3;--bad:#b3261e;--ok:#1b7f3b}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--panel:#1c2024;--ink:#e6e9ed;--dim:#98a1ac;--line:#2c3238;--accent:#3cc4bb;--accent-ink:#06201e;--mine:#17413e;--theirs:#262b31;--bad:#ff8a80;--ok:#6fd18a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.chip.on{color:var(--ok);border-color:var(--ok)}.chip.off{color:var(--bad);border-color:var(--bad)}
nav{display:flex;background:var(--panel);border-bottom:1px solid var(--line)}
nav button{flex:1;padding:10px;border:0;background:none;color:var(--dim);font:inherit;border-bottom:2px solid transparent;cursor:pointer}
nav button.sel{color:var(--accent);border-bottom-color:var(--accent)}
main{flex:1;min-height:0;display:flex}
.view{display:none;flex:1;min-width:0}.view.sel{display:flex}
#list{width:300px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
#list input{margin:8px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
#rows{overflow:auto;flex:1}
.row{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row.sel{background:var(--bg)}
.row .t{flex:1;min-width:0}.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--dim);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:99px;font-size:12px;padding:0 7px}
#thread{flex:1;display:flex;flex-direction:column;min-width:0}
#msgs{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:6px 10px;border-radius:10px;background:var(--theirs);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}
.m.me{background:var(--mine);align-self:flex-end}
.m small{display:block;color:var(--dim);font-size:11px}
.m small.bad{color:var(--bad)}
#compose{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel)}
#compose input,#cli input{flex:1;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;min-width:0}
button.go{padding:9px 16px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:inherit;cursor:pointer}
button.go:disabled{opacity:.5}
button.alt{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer}
.empty{margin:auto;color:var(--dim);padding:24px;text-align:center}
#node{flex-direction:column;overflow:auto;padding:16px;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.card h2{font-size:14px;margin:0 0 8px;color:var(--dim);font-weight:600}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}dt{color:var(--dim)}dd{margin:0;overflow-wrap:anywhere}
.btns{display:flex;gap:8px;flex-wrap:wrap}
#log{font:12px/1.4 ui-monospace,monospace;background:var(--bg);border-radius:8px;padding:8px;height:160px;overflow:auto;white-space:pre-wrap;margin-bottom:8px}
#cli{display:flex;gap:8px}
#back{display:none}
@media (max-width:700px){
  #list{width:100%;border:0}#thread{display:none}
  body.thread #list{display:none}body.thread #thread{display:flex}
  #back{display:inline-block}
}
</style>
</head>
<body>
<header><h1 id="title">MeshCore Node</h1><span class="chip" id="batt" hidden></span><span class="chip off" id="status">connecting</span></header>
<nav><button class="sel" data-v="chats">Chats</button><button data-v="node">Node</button></nav>
<main>
  <section class="view sel" id="chats">
    <div id="list"><input id="q" placeholder="Search" aria-label="Search chats"><div id="rows"></div></div>
    <div id="thread">
      <div id="msgs"><div class="empty">Pick a channel or contact.</div></div>
      <form id="compose" hidden><button type="button" class="alt" id="back">&larr;</button><input id="text" autocomplete="off" aria-label="Message"><button class="go" id="sendb">Send</button></form>
    </div>
  </section>
  <section class="view" id="node">
    <div class="card"><h2>This node</h2><dl id="info"></dl></div>
    <div class="card"><h2>Actions</h2><div class="btns">
      <button class="alt" id="adv0">Advert (nearby)</button><button class="alt" id="adv1">Advert (flood)</button>
      <button class="alt" id="clk">Sync clock</button><button class="alt" id="refresh">Reload contacts</button></div></div>
    <div class="card"><h2>Console</h2><div id="log"></div>
      <form id="cli"><input id="cmd" autocomplete="off" placeholder="get name, set radio 910.525,62.5,7,5, ..." aria-label="Command"><button class="go">Run</button></form></div>
  </section>
</main>
<script>/*@PROTO@*/</script>
<script>
'use strict';
var $ = function (id) { return document.getElementById(id); };
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
var TYPES = { 1: 'Companion', 2: 'Repeater', 3: 'Room', 4: 'Sensor' };

var S = { self: null, dev: null, contacts: {}, channels: {}, convs: {}, unread: {}, active: null, clockOff: 0, acks: {} };
var ws, queue = [], cur = null, syncing = false, again = false;

// ---- storage (per viewer convenience only; every access guarded) ----
function skey() { return 'mcw:' + (S.self ? S.self.key.slice(0, 16) : ''); }
function load() { try { var d = JSON.parse(localStorage.getItem(skey()) || '{}'); S.convs = d.convs || {}; S.unread = d.unread || {}; } catch (e) { } }
function save() { try { var c = {}; for (var k in S.convs) c[k] = S.convs[k].slice(-100); localStorage.setItem(skey(), JSON.stringify({ convs: c, unread: S.unread })); } catch (e) { } }

// ---- request/response over the socket (the protocol is one command, one answer, plus pushes) ----
function req(frame, accept, ms) {
  return new Promise(function (res, rej) { queue.push({ frame: frame, accept: accept, res: res, rej: rej, ms: ms || 8000 }); pump(); });
}
function pump() {
  if (cur || !queue.length || !ws || ws.readyState !== 1) return;
  cur = queue.shift();
  arm();
  ws.send(cur.frame);
}
function arm() { clearTimeout(cur.timer); cur.timer = setTimeout(function () { done(null, 'timeout'); }, cur.ms); }
function done(m, err) {
  if (!cur) return;
  clearTimeout(cur.timer); var c = cur; cur = null;
  if (err) c.rej(new Error(err)); else c.res(m);
  pump();
}
function onFrame(m) {
  if (cur) arm();
  if (cur && m.t === 'err') return done(null, 'error ' + m.code);
  if (cur && cur.accept.indexOf(m.t) >= 0) return done(m);
  push(m);
}

function connect() {
  setStatus(false, 'connecting');
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.binaryType = 'arraybuffer';
  ws.onopen = function () { init().catch(function (e) { setStatus(false, 'init failed: ' + e.message); try { ws.close(); } catch (x) { } }); };
  ws.onmessage = function (ev) { onFrame(MC.dec(new Uint8Array(ev.data))); };
  ws.onclose = function () {
    setStatus(false, 'offline'); if (cur) done(null, 'closed');
    while (queue.length) queue.shift().rej(new Error('closed'));
    setTimeout(connect, 3000);
  };
}
function setStatus(on, text) { var s = $('status'); s.textContent = text || (on ? 'connected' : 'offline'); s.className = 'chip ' + (on ? 'on' : 'off'); }

async function init() {
  S.dev = await req(MC.enc.deviceQuery(), ['device']);
  S.self = await req(MC.enc.appStart('web'), ['self']);
  load(); $('title').textContent = S.self.name || 'MeshCore Node';
  await syncClock(false);
  S.channels = {};
  for (var i = 0; i < S.dev.maxChannels; i++) {   // channels first: the contact list can be long; an empty or unreadable slot is skipped
    try { var c = await req(MC.enc.getChannel(i), ['channel']); if (c.name) S.channels[i] = c; } catch (e) { }
  }
  renderList();
  S.contacts = {}; try { await loadContacts(); } catch (e) { }
  setStatus(true); renderNode(); renderList(); battery(); syncAll();
}
async function loadContacts() {
  await req(MC.enc.getContacts(0), ['contactsEnd'], 30000);
  renderList();
}
async function syncClock(force) {
  var t = await req(MC.enc.getTime(), ['time']), now = Math.floor(Date.now() / 1000);
  if (force || now - t.secs > 120) { try { await req(MC.enc.setTime(now), ['ok']); t.secs = now; } catch (e) { } }
  S.clockOff = t.secs - now;
}
async function battery() { try { var b = await req(MC.enc.battery(), ['battery']); var c = $('batt'); c.hidden = false; c.textContent = (b.mv / 1000).toFixed(2) + ' V'; } catch (e) { } }

async function syncAll() {
  if (syncing) { again = true; return; }
  syncing = true;
  try { do { again = false; for (;;) { var m = await req(MC.enc.syncNext(), ['msg', 'noMore']); if (m.t === 'noMore') break; onMsg(m); } } while (again); }
  catch (e) { } finally { syncing = false; }
}

// ---- events from the node ----
function push(m) {
  if (m.t === 'contact' || m.t === 'newAdvert') { S.contacts[m.key] = m; renderList(); }
  else if (m.t === 'msgWaiting') syncAll();
  else if (m.t === 'delivered') {
    var hit = S.acks[m.ack]; if (hit) { hit.status = 'delivered'; hit.ms = m.tripMs; renderThread(); save(); }
  } else if (m.t === 'contactDeleted') { delete S.contacts[m.key]; renderList(); }
}
function isChannel(id) { return id.indexOf('ch:') === 0; }   // contact ids are hex, so they never start with "ch:"
function findContact(prefix) { for (var k in S.contacts) if (k.indexOf(prefix) === 0) return S.contacts[k]; return null; }
function add(conv, msg) {
  (S.convs[conv] = S.convs[conv] || []).push(msg);
  if (S.convs[conv].length > 200) S.convs[conv].shift();
}
function onMsg(m) {
  var conv, who;
  if (m.channel) { conv = 'ch:' + m.idx; who = null; }
  else { var c = findContact(m.from); conv = c ? c.key : m.from; who = c ? c.name : m.from; }
  add(conv, { me: false, text: m.text, ts: m.ts, who: who, snr: m.snr, hops: m.pathLen });
  if (S.active !== conv) S.unread[conv] = (S.unread[conv] || 0) + 1;
  save(); renderList(); if (S.active === conv) renderThread();
}

// ---- views ----
function convList() {
  var rows = [], k, q = $('q').value.toLowerCase();
  for (k in S.channels) rows.push({ id: 'ch:' + k, name: S.channels[k].name, sub: 'Channel ' + k });
  for (k in S.contacts) {
    var c = S.contacts[k];
    rows.push({ id: k, name: c.name, sub: (TYPES[c.type] || 'Node') + ' · ' + (c.pathLen === 255 ? 'flood' : c.pathLen + ' hop' + (c.pathLen === 1 ? '' : 's')), dm: c.type === 1 || c.type === 3 });
  }
  for (k in S.convs) if (!rows.some(function (r) { return r.id === k; })) rows.push({ id: k, name: k.slice(0, 12), sub: 'Unknown sender', dm: true });
  rows = rows.filter(function (r) { return !q || r.name.toLowerCase().indexOf(q) >= 0; });
  rows.forEach(function (r) { var l = S.convs[r.id]; r.last = l && l.length ? l[l.length - 1] : null; });
  rows.sort(function (a, b) { return (b.last ? b.last.ts : 0) - (a.last ? a.last.ts : 0) || a.name.localeCompare(b.name); });
  return rows;
}
function renderList() {
  var box = $('rows'); box.textContent = '';
  convList().forEach(function (r) {
    var row = el('div', 'row' + (S.active === r.id ? ' sel' : '')), t = el('div', 't');
    t.appendChild(el('b', '', r.name || '(no name)')); t.appendChild(el('small', '', r.last ? r.last.text : r.sub));
    row.appendChild(t);
    if (S.unread[r.id]) row.appendChild(el('span', 'badge', S.unread[r.id]));
    row.onclick = function () { open(r.id); };
    box.appendChild(row);
  });
  if (!box.firstChild) box.appendChild(el('div', 'empty', S.self ? 'No contacts yet. Send an advert from the Node tab.' : 'Connecting…'));
}
function open(id) {
  S.active = id; S.unread[id] = 0; save(); document.body.classList.add('thread');
  var row = convList().filter(function (r) { return r.id === id; })[0];
  $('compose').hidden = !(isChannel(id) || (row && row.dm));
  renderList(); renderThread(); $('text').focus();
}
function renderThread() {
  var box = $('msgs'); box.textContent = '';
  var list = S.convs[S.active] || [];
  if (!list.length) box.appendChild(el('div', 'empty', 'No messages yet.'));
  list.forEach(function (m) {
    var b = el('div', 'm' + (m.me ? ' me' : '')); b.appendChild(document.createTextNode(m.text));
    var meta = [new Date(m.ts * 1000).toLocaleString()];
    if (!m.me && m.snr != null) meta.push('SNR ' + m.snr);
    if (!m.me && m.hops !== undefined) meta.push(m.hops === 255 ? 'direct' : m.hops + ' hop' + (m.hops === 1 ? '' : 's'));
    var bad = false;
    if (m.me && m.status) { meta.push(m.status === 'delivered' ? '✓ delivered ' + (m.ms / 1000).toFixed(1) + ' s' : m.status); bad = m.status === 'no ack' || m.status === 'failed'; }
    var s = el('small', bad ? 'bad' : '', meta.join(' · ')); b.appendChild(s); box.appendChild(b);
  });
  box.scrollTop = box.scrollHeight;
}
function renderNode() {
  var s = S.self, d = S.dev, dl = $('info'); dl.textContent = '';
  [['Name', s.name], ['Public key', s.key], ['Radio', s.freqKHz + ' MHz / ' + s.bwKHz + ' kHz, SF' + s.sf + ' CR4/' + s.cr],
   ['TX power', s.txPower + ' dBm (max ' + s.maxTxPower + ')'], ['Firmware', d.version + ' (' + d.build + ')'], ['Board', d.maker],
   ['Capacity', d.maxContacts + ' contacts, ' + d.maxChannels + ' channels']].forEach(function (p) { dl.appendChild(el('dt', '', p[0])); dl.appendChild(el('dd', '', p[1])); });
}

// ---- sending ----
function devNow() { return Math.floor(Date.now() / 1000) + S.clockOff; }
async function sendMsg(ev) {
  ev.preventDefault();
  var text = $('text').value.trim(), id = S.active;
  if (!text || !id) return;
  if (MC.clipUtf8(text, 1e6).length > MC.MAX_TEXT) { alert('Too long: a message holds at most ' + MC.MAX_TEXT + ' bytes.'); return; }
  $('text').value = ''; var ts = devNow();
  var msg = { me: true, text: text, ts: ts, status: 'sending' }; add(id, msg); renderThread();
  try {
    if (isChannel(id)) { await req(MC.enc.sendChannel(+id.slice(3), text, ts), ['ok']); msg.status = 'sent'; }
    else {
      var r = await req(MC.enc.sendText(id, text, ts, 0), ['sent']);
      msg.status = r.flood ? 'sent (flood)' : 'sent (direct)'; S.acks[r.ack] = msg;
      setTimeout(function () { if (msg.status.indexOf('sent') === 0) { msg.status = 'no ack'; renderThread(); save(); } }, Math.max(r.timeoutMs * 1.5, 5000));
    }
  } catch (e) { msg.status = 'failed'; }
  renderThread(); save();
}

// ---- wiring ----
document.querySelectorAll('nav button').forEach(function (b) {
  b.onclick = function () {
    document.querySelectorAll('nav button,.view').forEach(function (x) { x.classList.remove('sel'); });
    b.classList.add('sel'); $(b.dataset.v).classList.add('sel');
  };
});
$('q').oninput = renderList;
$('compose').onsubmit = sendMsg;
$('back').onclick = function () { document.body.classList.remove('thread'); };
$('adv0').onclick = function () { req(MC.enc.advert(false), ['ok']).then(function () { logLine('advert sent (nearby)'); }, logErr); };
$('adv1').onclick = function () { req(MC.enc.advert(true), ['ok']).then(function () { logLine('advert sent (flood)'); }, logErr); };
$('clk').onclick = function () { syncClock(true).then(function () { logLine('clock set'); }, logErr); };
$('refresh').onclick = function () { S.contacts = {}; loadContacts().then(function () { logLine('contacts reloaded'); }, logErr); };
function logLine(t) { var l = $('log'); l.appendChild(document.createTextNode(t + '\n')); l.scrollTop = l.scrollHeight; }
function logErr(e) { logLine('! ' + e.message); }
$('cli').onsubmit = function (ev) {
  ev.preventDefault(); var c = $('cmd').value.trim(); if (!c) return; $('cmd').value = ''; logLine('> ' + c);
  req(MC.enc.cli(c), ['cli']).then(function (r) { logLine(r.text); }, function (e) { logLine('! ' + e.message + ' (older firmware has no console)'); });
};
connect();
</script>
</body>
</html>
